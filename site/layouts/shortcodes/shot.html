<figure class="shot">
  {{ partial "shot.html" (dict "name" (.Get "name") "src" (.Get "src") "dark" (.Get "dark") "alt" (.Get "alt" | default (.Inner | plainify)) "title" (.Get "title") "term" (.Get "term")) }}
