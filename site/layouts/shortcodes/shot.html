{{- /* {{< shot src="x.png" dark="x-dark.png" title="bar text" term=true >}}caption{{< /shot >}}
   or {{< shot name="x" title="bar text" >}}: x in the look that matches the site's skin.
   paper= and phosphor= add the Teletype pictures for the tty skin. */ -}}
<figure class="shot">
  {{ partial "shot.html" (dict "name" (.Get "name") "src" (.Get "src") "dark" (.Get "dark") "paper" (.Get "paper") "phosphor" (.Get "phosphor") "alt" (.Get "alt" | default (.Inner | plainify)) "title" (.Get "title") "term" (.Get "term")) }}
  {{ with .Inner }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
