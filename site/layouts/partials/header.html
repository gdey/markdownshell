<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ site.Home.RelPermalink }}"><span class="prompt">$</span> mdsh</a>
    <nav aria-label="Site">
      {{ range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="theme-switch" role="group" aria-label="Site look">
      <button type="button" value="tty" aria-pressed="true">tty</button>
      <button type="button" value="plain" aria-pressed="false">plain</button>
    </div>
  </div>
</header>
