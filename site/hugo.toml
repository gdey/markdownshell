# baseURL is set at build time by the Pages workflow (--baseURL), so moving
# to a custom domain needs no change here.
baseURL = "http://localhost:1313/"
languageCode = "en-us"
title = "mdsh"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "mdsh turns the markdown you already have into something that runs, and turns each run into a record you can send. A desktop app, a terminal UI and a CLI."
  repo = "https://github.com/gdey/markdownshell"

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

# The changelog page is the repo's CHANGELOG.md, read at build time, and
# the cheat sheet is docs/cheatsheet.md, mounted into the docs section,
# so the site never carries a second copy of either.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "../CHANGELOG.md"
    target = "assets/CHANGELOG.md"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../docs/cheatsheet.md"
    target = "content/docs/cheatsheet.md"

[menus]
  [[menus.main]]
    name = "Desktop app"
    pageRef = "/app"
    weight = 5
  [[menus.main]]
    name = "Examples"
    pageRef = "/examples"
    weight = 8
  [[menus.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 10
  [[menus.main]]
    name = "Use cases"
    pageRef = "/use-cases"
    weight = 15
  [[menus.main]]
    name = "Changelog"
    pageRef = "/changelog"
    weight = 18
  [[menus.main]]
    name = "GitHub"
    url = "https://github.com/gdey/markdownshell"
    weight = 20
