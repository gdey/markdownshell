# Release builds for mdsh. Tagging vX.Y.Z runs .github/workflows/release.yml,
# which runs goreleaser with this file. Check it locally with:
#   goreleaser release --snapshot --clean
version: 2

project_name: mdsh

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/mdsh
    binary: mdsh
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  # mdsh-gui's packages, which .github/workflows/gui-packages.yml builds.
  extra_files:
    - glob: ./gui-dist/*

changelog:
  disable: true

release:
  draft: true
  extra_files:
    - glob: ./gui-dist/*
