name: Release notes

# Writes a release's notes: its section of CHANGELOG.md, then a "What's
# Changed" list of the pull requests since the previous tag, as GitHub's
# "Generate release notes" button makes it, ending in the Full Changelog
# link. release.yml calls it after goreleaser publishes a release, whose
# own notes come out empty; run it from the Actions tab with a tag to
# write them again.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v1.4.1
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Write the notes
        run: |
          notes="$RUNNER_TEMP/notes.md"
          # The section under "## [X.Y.Z]", up to the next heading or the
          # link references at the end.
          awk -v v="${TAG#v}" '
            /^## \[/ { p = index($0, "[" v "]") > 0; next }
            /^\[[^]]*\]: / { p = 0 }
            p' CHANGELOG.md > "$notes"
          if ! grep -q . "$notes"; then
            echo "CHANGELOG.md has no section for $TAG" >&2
            exit 1
          fi
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          args=(-f tag_name="$TAG")
          [ -n "$prev" ] && args+=(-f previous_tag_name="$prev")
          printf '\n' >> "$notes"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body >> "$notes"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
