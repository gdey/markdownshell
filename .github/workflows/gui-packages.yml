name: GUI packages

# Builds mdsh-gui's packages: an unsigned universal macOS app in a .dmg
# and a .zip, and an AppImage for Linux. The release workflow calls it for
# a tag and adds the files to the release; it also runs on changes to the
# packaging and by hand, keeping the files as workflow artifacts.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
  pull_request:
    paths:
      - cmd/mdsh-gui/build/**
      - .github/workflows/gui-packages.yml

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cmd/mdsh-gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/mdsh-gui/go.mod
          cache-dependency-path: cmd/mdsh-gui/go.sum
      - run: build/darwin/app.sh "${{ inputs.version || format('0.0.0-dev.{0}', github.run_number) }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: gui-macos
          path: cmd/mdsh-gui/dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cmd/mdsh-gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/mdsh-gui/go.mod
          cache-dependency-path: cmd/mdsh-gui/go.sum
      - name: Install GTK, WebKitGTK and what AppImages need
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libfuse2t64 file
      - run: build/linux/appimage.sh "${{ inputs.version || format('0.0.0-dev.{0}', github.run_number) }}" dist
        env:
          # linuxdeploy is an AppImage itself; this runs it without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
      - uses: actions/upload-artifact@v4
        with:
          name: gui-linux
          path: cmd/mdsh-gui/dist/*
          if-no-files-found: error
