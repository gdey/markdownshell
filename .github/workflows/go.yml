name: Go

on:
  push:
    branches: [main]
  # A pull request that only touches docs, the site, or the changelog skips
  # these jobs. docs/spec.md stays in because doc's tests read it, and
  # examples/ stays in because its files are run as tests.
  pull_request:
    paths:
      - "**"
      - "!README.md"
      - "!CHANGELOG.md"
      - "!SECURITY.md"
      - "!LICENSE"
      - "!site/**"
      - "!docs/**"
      - "docs/spec.md"
      - "!cmd/mdsh-gui/README.md"

# A new push to a pull request cancels that pull request's older run, so a
# rebase does not leave stale jobs waiting on scarce macOS runners. Each push
# to main gets a group of its own, so main's runs neither wait on each other
# nor cancel each other.
concurrency:
  group: go-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Set the MACOS_RUNNER repository variable (a JSON list of labels, such
    # as ["self-hosted","macOS"]) to run the macOS jobs on a self-hosted Mac.
    # Pull requests from forks always use GitHub's runners.
    runs-on: ${{ matrix.os == 'macos-latest' && vars.MACOS_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.MACOS_RUNNER) || matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps Go's caches on its own disk; saving
          # them to GitHub's cache from there took 11 minutes a job.
          cache: ${{ runner.environment != 'self-hosted' }}
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: go vet ./...
      - run: go test -race ./...

  gui:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Set the MACOS_RUNNER repository variable (a JSON list of labels, such
    # as ["self-hosted","macOS"]) to run the macOS jobs on a self-hosted Mac.
    # Pull requests from forks always use GitHub's runners.
    runs-on: ${{ matrix.os == 'macos-latest' && vars.MACOS_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.MACOS_RUNNER) || matrix.os }}
    defaults:
      run:
        working-directory: cmd/mdsh-gui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cmd/mdsh-gui/go.mod
          cache-dependency-path: cmd/mdsh-gui/go.sum
          # A self-hosted runner keeps Go's caches on its own disk; saving
          # them to GitHub's cache from there took 11 minutes a job.
          cache: ${{ runner.environment != 'self-hosted' }}
      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install the oldest Neovim the source pane supports
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 8 --retry-all-errors -o "$RUNNER_TEMP/nvim.tar.gz" https://github.com/neovim/neovim/releases/download/v0.10.0/nvim-linux64.tar.gz
          echo "be1f0988d0de71c375982b87b86cd28d2bab35ece8285abe3b0aac57604dfc5a  $RUNNER_TEMP/nvim.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "MDSH_TEST_NVIM=$RUNNER_TEMP/nvim-linux64/bin/nvim" >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build .
      - name: Check the vendored JavaScript matches its lock
        if: runner.os == 'Linux'
        run: go run ./internal/vendorjs && git diff --exit-code -- frontend/vendor
      - name: Check the bindings and bundle are generated
        if: runner.os == 'Linux'
        run: go generate && git diff --exit-code -- frontend
      - name: Type-check the frontend
        if: runner.os == 'Linux'
        run: npx --yes --package typescript@5.9.3 tsc -p frontend
      # Typing in the source view of a long document must redraw only the
      # cards whose markdown changed, and draw them as a fresh draw would.
      # These are counts, not times, so a slow runner doesn't fail them.
      - name: Check typing on long documents in the browser
        if: runner.os == 'Linux'
        run: |
          CGO_ENABLED=0 go build -tags server -o "$RUNNER_TEMP/mdsh-gui-server" .
          # npm ci installs exactly what internal/stress/package-lock.json
          # names and checks each package against its integrity hash. The
          # locked playwright-core fixes which Chromium build it fetches.
          mkdir -p "$RUNNER_TEMP/pw"
          cp internal/stress/package.json internal/stress/package-lock.json "$RUNNER_TEMP/pw/"
          npm ci --prefix "$RUNNER_TEMP/pw" --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node internal/stress/gui.cjs --server "$RUNNER_TEMP/mdsh-gui-server" --check
