name: Go

on:
  push:
    branches: [main]
  # A pull request that only touches docs, the site, or the changelog skips
  # these jobs. docs/spec.md stays in because doc's tests read it, and
  # examples/ stays in because its files are run as tests.
  pull_request:
    paths:
      - "**"
      - "!README.md"
      - "!CHANGELOG.md"
      - "!SECURITY.md"
      - "!LICENSE"
      - "!site/**"
      - "!docs/**"
      - "docs/spec.md"
      - "!cmd/mdsh-gui/README.md"

# A new push to a pull request cancels that pull request's older run, so a
# rebase does not leave stale jobs waiting on scarce macOS runners. Runs on
# main are never cancelled.
concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Set the MACOS_RUNNER repository variable (a JSON list of labels, such
    # as ["self-hosted","macOS"]) to run the macOS jobs on a self-hosted Mac.
    # Pull requests from forks always use GitHub's runners.
    runs-on: ${{ matrix.os == 'macos-latest' && vars.MACOS_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.MACOS_RUNNER) || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: go vet ./...
      - run: go test -race ./...

  gui:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Set the MACOS_RUNNER repository variable (a JSON list of labels, such
    # as ["self-hosted","macOS"]) to run the macOS jobs on a self-hosted Mac.
    # Pull requests from forks always use GitHub's runners.
    runs-on: ${{ matrix.os == 'macos-latest' && vars.MACOS_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.MACOS_RUNNER) || matrix.os }}
    defaults:
      run:
        working-directory: cmd/mdsh-gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/mdsh-gui/go.mod
          cache-dependency-path: cmd/mdsh-gui/go.sum
      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install the oldest Neovim the source pane supports
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://github.com/neovim/neovim/releases/download/v0.10.0/nvim-linux64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "MDSH_TEST_NVIM=$RUNNER_TEMP/nvim-linux64/bin/nvim" >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build .
      - name: Check the vendored JavaScript matches its lock
        if: runner.os == 'Linux'
        run: go run ./internal/vendorjs && git diff --exit-code -- frontend/vendor
      - name: Check the bindings and bundle are generated
        if: runner.os == 'Linux'
        run: go generate && git diff --exit-code -- frontend
      - name: Type-check the frontend
        if: runner.os == 'Linux'
        run: npx --yes --package typescript@5.9.3 tsc -p frontend
