name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  gui:
    needs: version
    uses: ./.github/workflows/gui-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: gui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Release notes from CHANGELOG.md
        run: |
          # The section under "## [X.Y.Z]" for tag vX.Y.Z, up to the next
          # heading or the link references at the end.
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## \[/ { p = index($0, "[" v "]") > 0; next }
            /^\[[^]]*\]: / { p = 0 }
            p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q . "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: mdsh-gui's packages
        uses: actions/download-artifact@v4
        with:
          pattern: gui-*
          path: gui-dist
          merge-multiple: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
